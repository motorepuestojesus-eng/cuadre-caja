<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Caja Moto Repuestos Jesús - Control Físico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-excel td, .table-excel th { border: 1px solid black; padding: 2px; font-size: 12px; }
        input { width: 100%; border: none; text-align: center; }
        input:focus { background: #fff9c4; outline: none; }
        .bg-header { background: #f3f4f6; font-weight: bold; }
        .alerta-error { background: #fee2e2; color: #b91c1c; border: 2px solid #b91c1c; }
        .alerta-exito { background: #dcfce7; color: #15803d; border: 2px solid #15803d; }
    </style>
</head>
<body class="p-4 bg-gray-100">

    <div class="max-w-[1200px] mx-auto bg-white p-6 shadow-2xl border border-gray-400">
        <div class="flex justify-between items-start mb-4 border-b-2 border-black pb-2">
            <div>
                <h1 class="text-2xl font-black italic">VENTAS DIARIAS</h1>
                <p class="text-xs font-bold">MOTO REPUESTOS JESÚS</p>
            </div>
            <div class="text-right">
                <div class="flex gap-2 mb-1"><span>Fecha:</span><input type="text" id="fecha" value="1-dic" class="border-b border-black w-24"></div>
                <div class="flex gap-2 border-2 border-black p-1"><span>Tasa:</span><input type="number" id="tasa" value="247.30" step="0.01" onchange="calcularTodo()" class="font-bold"></div>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-6">
            <div class="col-span-8">
                <table class="table-excel w-full">
                    <thead class="bg-header">
                        <tr>
                            <th>FACTURA</th>
                            <th>Nro Cli</th>
                            <th>$</th>
                            <th>Bs Efec</th>
                            <th>Débito</th>
                            <th>P. Móvil</th>
                            <th>Total Bs</th>
                            <th>Total $</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoVentas">
                        </tbody>
                    <tfoot class="bg-header" id="pieVentas"></tfoot>
                </table>
            </div>

            <div class="col-span-4 space-y-4">
                <div class="border-2 border-black p-3 bg-white">
                    <h3 class="text-center font-bold border-b border-black mb-2 text-sm uppercase">Conteo de Billetes ($)</h3>
                    <div id="conteoBilletes" class="space-y-1">
                        </div>
                    <div class="mt-3 pt-2 border-t-2 border-black flex justify-between font-black text-lg">
                        <span>TOTAL FÍSICO:</span>
                        <span id="totalFisicoUsd">0.00</span>
                    </div>
                </div>

                <div id="statusCaja" class="p-4 text-center">
                    <h2 class="font-bold text-xs uppercase mb-1">Resultado del Cuadre</h2>
                    <div id="resultadoTexto" class="text-xl font-black italic">---</div>
                    <div id="diferenciaMonto" class="text-2xl font-black mt-2">0.00</div>
                </div>
                
                <button onclick="guardarCierre()" class="w-full bg-black text-white font-bold py-3 hover:bg-gray-800">GUARDAR CIERRE</button>
            </div>
        </div>
    </div>

    <script>
        let db = {
            ventas: Array(15).fill().map(() => ({ fact: '', cli: 0, usd: 0, bsE: 0, deb: 0, pm: 0 })),
            billetes: { 100:0, 50:0, 20:0, 10:0, 5:0, 2:0, 1:0 }
        };

        function calcularTodo() {
            const tasa = parseFloat(document.getElementById('tasa').value) || 1;
            
            // 1. Calcular Ventas
            let tUsd=0, tBsE=0, tFinalUsd=0;
            const cv = document.getElementById('cuerpoVentas'); cv.innerHTML = "";
            
            db.ventas.forEach((v, i) => {
                const sumaBs = (v.bsE||0) + (v.deb||0) + (v.pm||0);
                const totalF = (v.usd||0) + (sumaBs / tasa);
                tUsd += (v.usd||0); tBsE += (v.bsE||0); tFinalUsd += totalF;

                cv.innerHTML += `<tr>
                    <td><input value="${v.fact}" onchange="db.ventas[${i}].fact=this.value; calcularTodo()"></td>
                    <td><input type="number" value="${v.cli||''}" onchange="db.ventas[${i}].cli=parseFloat(this.value); calcularTodo()"></td>
                    <td><input type="number" value="${v.usd||''}" onchange="db.ventas[${i}].usd=parseFloat(this.value); calcularTodo()"></td>
                    <td><input type="number" value="${v.bsE||''}" onchange="db.ventas[${i}].bsE=parseFloat(this.value); calcularTodo()"></td>
                    <td><input type="number" value="${v.deb||''}" onchange="db.ventas[${i}].deb=parseFloat(this.value); calcularTodo()"></td>
                    <td><input type="number" value="${v.pm||''}" onchange="db.ventas[${i}].pm=parseFloat(this.value); calcularTodo()"></td>
                    <td class="text-right px-1">${sumaBs.toFixed(2)}</td>
                    <td class="text-right px-1 font-bold">${totalF.toFixed(2)}</td>
                </tr>`;
            });

            // 2. Calcular Billetes
            let fisicoTotal = 0;
            const cb = document.getElementById('conteoBilletes'); cb.innerHTML = "";
            [100, 50, 20, 10, 5, 2, 1].forEach(den => {
                const cant = db.billetes[den] || 0;
                fisicoTotal += (cant * den);
                cb.innerHTML += `<div class="flex justify-between items-center text-sm">
                    <span class="font-bold w-12 border-r border-black">${den} $</span>
                    <input type="number" value="${cant||''}" onchange="db.billetes[${den}]=parseInt(this.value); calcularTodo()" class="w-16 border-b border-gray-300 mx-2">
                    <span class="w-20 text-right font-mono">${(cant*den).toFixed(2)}</span>
                </div>`;
            });
            document.getElementById('totalFisicoUsd').innerText = fisicoTotal.toFixed(2);

            // 3. COMPARACIÓN (CUADRE)
            // Comparamos el "Total Físico" contra lo que entró en la columna "$" (divisas)
            const diferencia = fisicoTotal - tUsd;
            const statusBox = document.getElementById('statusCaja');
            const resTexto = document.getElementById('resultadoTexto');
            const resMonto = document.getElementById('diferenciaMonto');

            if (Math.abs(diferencia) < 0.01) {
                statusBox.className = "p-4 text-center alerta-exito";
                resTexto.innerText = "CAJA CUADRADA";
                resMonto.innerText = "0.00";
            } else if (diferencia > 0) {
                statusBox.className = "p-4 text-center alerta-exito";
                resTexto.innerText = "SOBRA DINERO";
                resMonto.innerText = "+ " + diferencia.toFixed(2);
            } else {
                statusBox.className = "p-4 text-center alerta-error";
                resTexto.innerText = "FALTA DINERO";
                resMonto.innerText = "- " + Math.abs(diferencia).toFixed(2);
            }
        }

        function guardarCierre() {
            alert("Cierre guardado. Los datos se han enviado al Historial y al Consolidado Mensual.");
        }

        calcularTodo();
    </script>
</body>
</html>
