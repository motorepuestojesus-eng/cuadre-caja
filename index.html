<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadre de Caja - Moto Repuestos Jesús</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 p-4 font-sans text-sm">
    <div class="max-w-6xl mx-auto bg-white p-6 shadow-2xl rounded-lg">
        <h1 class="text-2xl font-bold text-center border-b-2 border-black mb-4 pb-2">CUADRE DE CAJA</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <div class="space-y-6">
                <div class="border border-gray-400 p-3">
                    <h2 class="font-bold bg-gray-100 p-1 mb-2">RESUMEN DE VENTAS</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <span>Ventas del día $:</span>
                        <input type="number" id="ventasDia" value="0" oninput="calcular()" class="border text-right px-2 font-bold text-blue-600">
                        <span>Tasa del día:</span>
                        <input type="number" id="tasa" value="60.00" oninput="calcular()" class="border text-right px-2 bg-yellow-50">
                        <span class="font-bold">Total Bs:</span>
                        <div id="totalVentasBs" class="text-right font-bold">0,00</div>
                    </div>
                </div>

                <div class="border border-gray-400">
                    <table class="w-full">
                        <thead><tr class="bg-gray-100 border-b border-gray-400"><th colspan="2" class="p-1">Otros Ingresos</th></tr></thead>
                        <tbody id="tablaIngresos">
                            </tbody>
                    </table>
                    <div class="p-2 flex gap-2">
                        <input type="text" id="ingDesc" placeholder="Concepto" class="border w-full px-1">
                        <input type="number" id="ingMonto" placeholder="Monto $" class="border w-24 px-1">
                        <button onclick="agregarFila('ingresos')" class="bg-green-600 text-white px-2 rounded">+</button>
                    </div>
                </div>

                <div class="border border-gray-400">
                    <table class="w-full text-left">
                        <thead><tr class="bg-red-100 border-b border-gray-400"><th colspan="2" class="p-1">Gastos / Egresos</th></tr></thead>
                        <tbody id="tablaGastos">
                            </tbody>
                    </table>
                    <div class="p-2 flex gap-2">
                        <input type="text" id="gasDesc" placeholder="Descripción" class="border w-full px-1">
                        <input type="number" id="gasMonto" placeholder="Monto $" class="border w-24 px-1">
                        <button onclick="agregarFila('gastos')" class="bg-red-600 text-white px-2 rounded">+</button>
                    </div>
                </div>

                <div class="bg-black text-white p-4 rounded text-lg font-bold">
                    <div class="flex justify-between">
                        <span>SALDO PARA ENTREGAR:</span>
                        <span id="saldoFinal">$ 0.00</span>
                    </div>
                </div>
            </div>

            <div class="border-2 border-black p-4 rounded bg-gray-50">
                <h2 class="text-center font-bold text-lg mb-4 border-b border-black">EFECTIVO EN CAJA (Bs)</h2>
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="border-b border-black">
                            <th class="text-left">Denominación</th>
                            <th class="text-center">Cant.</th>
                            <th class="text-right">Total Bs</th>
                        </tr>
                    </thead>
                    <tbody class="text-lg">
                        <tr class="border-b"><td>100</td><td><input type="number" class="cant border w-16 text-center" data-val="100" oninput="calcular()"></td><td class="text-right sub">0</td></tr>
                        <tr class="border-b"><td>50</td><td><input type="number" class="cant border w-16 text-center" data-val="50" oninput="calcular()"></td><td class="text-right sub">0</td></tr>
                        <tr class="border-b"><td>20</td><td><input type="number" class="cant border w-16 text-center" data-val="20" oninput="calcular()"></td><td class="text-right sub">0</td></tr>
                        <tr class="border-b"><td>10</td><td><input type="number" class="cant border w-16 text-center" data-val="10" oninput="calcular()"></td><td class="text-right sub">0</td></tr>
                        <tr class="border-b"><td>5</td><td><input type="number" class="cant border w-16 text-center" data-val="5" oninput="calcular()"></td><td class="text-right sub">0</td></tr>
                        <tr class="border-b"><td>1</td><td><input type="number" class="cant border w-16 text-center" data-val="1" oninput="calcular()"></td><td class="text-right sub">0</td></tr>
                    </tbody>
                </table>
                <div class="mt-4 p-2 bg-yellow-200 border-2 border-yellow-600">
                    <div class="flex justify-between font-bold"><span>Total Efectivo:</span><span id="efectivoTotalBs">0</span></div>
                    <div class="flex justify-between text-blue-800 font-bold border-t border-yellow-600 mt-2">
                        <span>En Dólares:</span><span id="efectivoTotalUsd">$ 0.00</span>
                    </div>
                </div>
                
                <div id="resultado" class="mt-4 p-3 text-center font-bold text-xl rounded">
                    </div>
            </div>

        </div>
    </div>

    <script>
        let datos = JSON.parse(localStorage.getItem('cuadre_jesus')) || { ingresos: [], gastos: [] };

        function agregarFila(tipo) {
            const desc = document.getElementById(tipo === 'ingresos' ? 'ingDesc' : 'gasDesc').value;
            const monto = parseFloat(document.getElementById(tipo === 'ingresos' ? 'ingMonto' : 'gasMonto').value);
            if (!desc || isNaN(monto)) return;

            datos[tipo].push({ desc, monto });
            localStorage.setItem('cuadre_jesus', JSON.stringify(datos));
            
            document.getElementById(tipo === 'ingresos' ? 'ingDesc' : 'gasDesc').value = "";
            document.getElementById(tipo === 'ingresos' ? 'ingMonto' : 'gasMonto').value = "";
            renderTablas();
        }

        function renderTablas() {
            ['ingresos', 'gastos'].forEach(tipo => {
                const tbody = document.getElementById(tipo === 'ingresos' ? 'tablaIngresos' : 'tablaGastos');
                tbody.innerHTML = "";
                datos[tipo].forEach((item, i) => {
                    tbody.innerHTML += `<tr class="border-b">
                        <td class="p-1">${item.desc}</td>
                        <td class="p-1 text-right">$${item.monto.toFixed(2)} 
                        <button onclick="eliminar('${tipo}', ${i})" class="text-red-500 ml-2">×</button></td>
                    </tr>`;
                });
            });
            calcular();
        }

        function eliminar(tipo, i) {
            datos[tipo].splice(i, 1);
            localStorage.setItem('cuadre_jesus', JSON.stringify(datos));
            renderTablas();
        }

        function calcular() {
            const tasa = parseFloat(document.getElementById('tasa').value) || 1;
            const vDia = parseFloat(document.getElementById('ventasDia').value) || 0;
            
            // Ventas en Bs
            document.getElementById('totalVentasBs').innerText = (vDia * tasa).toLocaleString('es-VE') + " Bs";

            // Totales de tablas
            const sumIng = datos.ingresos.reduce((a, b) => a + b.monto, 0);
            const sumGas = datos.gastos.reduce((a, b) => a + b.monto, 0);
            
            const saldoEsperado = vDia + sumIng - sumGas;
            document.getElementById('saldoFinal').innerText = `$ ${saldoEsperado.toFixed(2)}`;

            // Billetes
            let totalBs = 0;
            const cants = document.querySelectorAll('.cant');
            const subs = document.querySelectorAll('.sub');
            
            cants.forEach((input, i) => {
                const sub = (parseFloat(input.value) || 0) * parseFloat(input.dataset.val);
                subs[i].innerText = sub.toLocaleString('es-VE');
                totalBs += sub;
            });

            const totalUsdCaja = totalBs / tasa;
            document.getElementById('efectivoTotalBs').innerText = totalBs.toLocaleString('es-VE') + " Bs";
            document.getElementById('efectivoTotalUsd').innerText = `$ ${totalUsdCaja.toFixed(2)}`;

            // Comparación
            const resDiv = document.getElementById('resultado');
            const diff = totalUsdCaja - saldoEsperado;

            if (Math.abs(diff) < 0.05) {
                resDiv.innerText = "CAJA CUADRADA";
                resDiv.className = "mt-4 p-3 text-center font-bold text-xl rounded bg-green-500 text-white";
            } else if (diff > 0) {
                resDiv.innerText = "SOBRANTE: $" + diff.toFixed(2);
                resDiv.className = "mt-4 p-3 text-center font-bold text-xl rounded bg-blue-500 text-white";
            } else {
                resDiv.innerText = "FALTANTE: $" + Math.abs(diff).toFixed(2);
                resDiv.className = "mt-4 p-3 text-center font-bold text-xl rounded bg-red-500 text-white";
            }
        }

        renderTablas();
    </script>
</body>
</html>
