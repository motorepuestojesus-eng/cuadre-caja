<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas y Cuadre - Moto Repuestos Jesús</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-gray-100 p-2 sm:p-4 font-sans text-xs">
    <div class="max-w-7xl mx-auto space-y-4">
        
        <div class="bg-white p-4 rounded shadow flex justify-between items-center border-l-4 border-blue-600">
            <h1 class="text-lg font-bold">CUADRE DE CAJA DIARIO</h1>
            <div class="flex items-center gap-2">
                <span class="font-bold">TASA BS:</span>
                <input type="number" id="tasa" value="60.00" oninput="calcularTodo()" class="border-2 border-blue-600 rounded p-1 w-24 text-right font-bold text-blue-600">
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
            
            <div class="lg:col-span-3 bg-white p-4 rounded shadow overflow-x-auto">
                <h2 class="font-bold mb-2 bg-gray-800 text-white p-1 text-center">VENTAS DIARIAS</h2>
                <table class="w-full border-collapse border border-gray-300">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="border p-1">FACTURA</th>
                            <th class="border p-1">CLIENTES</th>
                            <th class="border p-1">$</th>
                            <th class="border p-1">Bs Efectivo</th>
                            <th class="border p-1">Débito</th>
                            <th class="border p-1">Pago Móvil</th>
                            <th class="border p-1 text-blue-700">Total $</th>
                            <th class="border p-1">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoFacturas">
                        <tr class="bg-yellow-50">
                            <td class="border p-1"><input type="text" id="inFac" class="w-full bg-transparent"></td>
                            <td class="border p-1"><input type="text" id="inCli" class="w-full bg-transparent"></td>
                            <td class="border p-1"><input type="number" id="inDol" class="w-full bg-transparent text-right"></td>
                            <td class="border p-1"><input type="number" id="inBsE" class="w-full bg-transparent text-right"></td>
                            <td class="border p-1"><input type="number" id="inDeb" class="w-full bg-transparent text-right"></td>
                            <td class="border p-1"><input type="number" id="inPag" class="w-full bg-transparent text-right"></td>
                            <td class="border p-1 bg-gray-100"></td>
                            <td class="border p-1 text-center"><button onclick="agregarFactura()" class="bg-blue-600 text-white px-2 rounded font-bold hover:bg-blue-800">AÑADIR</button></td>
                        </tr>
                    </tbody>
                    <tfoot class="bg-gray-800 text-white font-bold text-sm">
                        <tr>
                            <td colspan="6" class="p-2 text-right">TOTAL VENTAS ($):</td>
                            <td id="totalVentasFinal" class="p-2 text-right text-yellow-400">0.00</td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="bg-white p-4 rounded shadow border-t-4 border-green-600">
                <h2 class="font-bold mb-4 text-center border-b">EFECTIVO EN CAJA (CANTIDADES)</h2>
                <div class="space-y-3">
                    <div class="flex items-center justify-between gap-2">
                        <span class="w-16 font-bold text-gray-600">100 Bs:</span>
                        <input type="number" class="cant-billete border rounded p-1 w-20 text-center bg-green-50" data-deno="100" oninput="calcularTodo()" placeholder="0">
                        <span class="w-20 text-right sub-bs font-mono text-gray-400">0</span>
                    </div>
                    <div class="flex items-center justify-between gap-2">
                        <span class="w-16 font-bold text-gray-600">50 Bs:</span>
                        <input type="number" class="cant-billete border rounded p-1 w-20 text-center bg-green-50" data-deno="50" oninput="calcularTodo()" placeholder="0">
                        <span class="w-20 text-right sub-bs font-mono text-gray-400">0</span>
                    </div>
                    <div class="flex items-center justify-between gap-2">
                        <span class="w-16 font-bold text-gray-600">20 Bs:</span>
                        <input type="number" class="cant-billete border rounded p-1 w-20 text-center bg-green-50" data-deno="20" oninput="calcularTodo()" placeholder="0">
                        <span class="w-20 text-right sub-bs font-mono text-gray-400">0</span>
                    </div>
                    <div class="flex items-center justify-between gap-2">
                        <span class="w-16 font-bold text-gray-600">10 Bs:</span>
                        <input type="number" class="cant-billete border rounded p-1 w-20 text-center bg-green-50" data-deno="10" oninput="calcularTodo()" placeholder="0">
                        <span class="w-20 text-right sub-bs font-mono text-gray-400">0</span>
                    </div>
                    <div class="flex items-center justify-between gap-2">
                        <span class="w-16 font-bold text-gray-600">5 Bs:</span>
                        <input type="number" class="cant-billete border rounded p-1 w-20 text-center bg-green-50" data-deno="5" oninput="calcularTodo()" placeholder="0">
                        <span class="w-20 text-right sub-bs font-mono text-gray-400">0</span>
                    </div>
                    <div class="flex items-center justify-between gap-2">
                        <span class="w-16 font-bold text-gray-600">1 Bs:</span>
                        <input type="number" class="cant-billete border rounded p-1 w-20 text-center bg-green-50" data-deno="1" oninput="calcularTodo()" placeholder="0">
                        <span class="w-20 text-right sub-bs font-mono text-gray-400">0</span>
                    </div>

                    <div class="mt-4 pt-4 border-t-2 border-black space-y-2">
                        <div class="flex justify-between font-black text-sm">
                            <span>TOTAL BS:</span>
                            <span id="totalCajaBs">0.00</span>
                        </div>
                        <div class="flex justify-between font-black text-blue-700 text-sm">
                            <span>TOTAL EN $:</span>
                            <span id="totalCajaUsd">0.00</span>
                        </div>
                    </div>
                    
                    <div id="statusCaja" class="mt-4 p-2 rounded text-center font-bold text-sm">
                        </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let facturas = JSON.parse(localStorage.getItem('ventas_jesus')) || [];

        function agregarFactura() {
            const f = {
                fac: document.getElementById('inFac').value,
                cli: document.getElementById('inCli').value,
                dol: parseFloat(document.getElementById('inDol').value) || 0,
                bse: parseFloat(document.getElementById('inBsE').value) || 0,
                deb: parseFloat(document.getElementById('inDeb').value) || 0,
                pag: parseFloat(document.getElementById('inPag').value) || 0
            };
            
            if(!f.fac) return alert("Pon el número de factura");
            
            facturas.push(f);
            localStorage.setItem('ventas_jesus', JSON.stringify(facturas));
            limpiarInputs();
            renderFacturas();
        }

        function limpiarInputs() {
            ['inFac', 'inCli', 'inDol', 'inBsE', 'inDeb', 'inPag'].forEach(id => document.getElementById(id).value = "");
        }

        function renderFacturas() {
            const tabla = document.getElementById('cuerpoFacturas');
            const filasManuales = tabla.rows[0].innerHTML;
            tabla.innerHTML = `<tr class="bg-yellow-50">${filasManuales}</tr>`;
            
            let totalGeneral = 0;
            const tasa = parseFloat(document.getElementById('tasa').value) || 1;

            facturas.forEach((f, i) => {
                const totalF = f.dol + ((f.bse + f.deb + f.pag) / tasa);
                totalGeneral += totalF;
                
                tabla.innerHTML += `
                    <tr>
                        <td class="border p-1 text-center">${f.fac}</td>
                        <td class="border p-1">${f.cli}</td>
                        <td class="border p-1 text-right font-bold">$${f.dol.toFixed(2)}</td>
                        <td class="border p-1 text-right">${f.bse.toFixed(2)}</td>
                        <td class="border p-1 text-right">${f.deb.toFixed(2)}</td>
                        <td class="border p-1 text-right">${f.pag.toFixed(2)}</td>
                        <td class="border p-1 text-right font-bold text-blue-700 bg-blue-50">$${totalF.toFixed(2)}</td>
                        <td class="border p-1 text-center"><button onclick="eliminar(${i})" class="text-red-500 font-bold">✖</button></td>
                    </tr>`;
            });

            document.getElementById('totalVentasFinal').innerText = totalGeneral.toFixed(2);
            calcularTodo();
        }

        function calcularTodo() {
            const tasa = parseFloat(document.getElementById('tasa').value) || 1;
            let sumaBs = 0;
            
            // Calcular billetes por cantidad
            document.querySelectorAll('.cant-billete').forEach((input, i) => {
                const cant = parseFloat(input.value) || 0;
                const deno = parseFloat(input.dataset.deno);
                const sub = cant * deno;
                document.querySelectorAll('.sub-bs')[i].innerText = sub.toFixed(2);
                sumaBs += sub;
            });

            const totalCajaUsd = sumaBs / tasa;
            document.getElementById('totalCajaBs').innerText = sumaBs.toLocaleString('es-VE', {minimumFractionDigits: 2});
            document.getElementById('totalCajaUsd').innerText = totalCajaUsd.toFixed(2);

            // Comparación con ventas
            const totalVentasUSD = parseFloat(document.getElementById('totalVentasFinal').innerText) || 0;
            const diff = totalCajaUsd - totalVentasUSD;
            const status = document.getElementById('statusCaja');

            if (Math.abs(diff) < 0.05) {
                status.innerText = "CAJA CUADRADA ✅";
                status.className = "mt-4 p-2 rounded text-center font-bold text-sm bg-green-600 text-white";
            } else if (diff > 0) {
                status.innerText = "SOBRANTE: $" + diff.toFixed(2);
                status.className = "mt-4 p-2 rounded text-center font-bold text-sm bg-blue-600 text-white";
            } else {
                status.innerText = "FALTANTE: $" + Math.abs(diff).toFixed(2);
                status.className = "mt-4 p-2 rounded text-center font-bold text-sm bg-red-600 text-white";
            }
        }

        function eliminar(i) {
            facturas.splice(i, 1);
            localStorage.setItem('ventas_jesus', JSON.stringify(facturas));
            renderFacturas();
        }

        renderFacturas();
    </script>
</body>
</html>
